const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function render(id){
  const d=S[id];
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.id===id));
  let total=0;
  const rows=d.cuts.map((c,i)=>{const st=total;total+=c.s;return `<div class="row">
    <div class="no">${i+1}</div>
    <div class="fr">${c.sk}</div>
    <div class="tx cell"><div class="shot">${c.size}</div><p>${c.what}</p><p class="aim">ねらい：${c.aim}</p></div>
    <div class="au cell"><p>♪ ${c.snd}</p>${c.cap?`<span class="cap">${c.cap}</span>`:'<span class="aim">文字なし</span>'}</div>
    <div class="sec">${c.s}<small>${st}〜${total}秒</small></div></div>`}).join('');
  document.getElementById('panel').innerHTML=`<div class="panel ${d.portrait?'portrait':''}">
    <div class="meta">${d.meta.map(m=>`<span>${m}</span>`).join('')}</div>
    <div class="core">${d.core.map(([k,v])=>`<div><b>${k}</b>${v}</div>`).join('')}</div>
    <h2>絵コンテ</h2>
    <div class="sheet" style="--fw:${d.fw}">
      <div class="row head"><div>カット</div><div>画面</div><div>内容</div><div>音・文字（編集で入れる）</div><div>秒</div></div>${rows}
    </div>
    <h2>プロに見せる工夫</h2><ul class="tips">${d.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
    <h2>Omniに貼る指示文</h2>
    ${d.blocks.map((b,i)=>`<div class="block"><h3>${b.t}<button class="copy" data-k="p${i}">コピー</button></h3><div class="ref">${b.ref}</div><pre id="${id}-p${i}">${esc(b.p)}</pre></div>`).join('')}
    <div class="block"><h3>避けるもの（全ブロック共通）<button class="copy" data-k="neg">コピー</button></h3><pre id="${id}-neg">${esc(d.neg)}</pre></div>
    <h2>本間さんに見てほしいこと</h2>
    <div class="check">${d.ask.map(([k,v])=>`<div><b>${k}</b><br>${v}</div>`).join('')}</div></div>`;
  document.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{
    const el=document.getElementById(id+'-'+b.dataset.k);
    const done=()=>{b.textContent='コピーしました';setTimeout(()=>b.textContent='コピー',1600)};
    const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='選択しました';};
    try{navigator.clipboard.writeText(el.textContent).then(done,sel)}catch(e){sel()}
  });
}
function route(){const h=location.hash.slice(1);render(S[h]?h:'kenshu')}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{location.hash=t.dataset.id});
addEventListener('hashchange',route);route();
